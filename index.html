<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Neon Intervals - Ein moderner, minimalistischer Intervall-Timer mit edlem Soft-Neon-Glow.">
  <title>Neon Intervals</title>
  
  <link rel="icon" type="image/jpeg" href="Training.jpeg">
  <link rel="apple-touch-icon" href="Training.jpeg">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Intervals">
  
  <style>
    /* SOFT MODERN NEON DESIGN TOKENS */
    :root {
      --bg-black: #050505;
      
      /* Neon Light Tones */
      --neon-green: #00ff66;
      --neon-purple: #b666ff;
      --neon-red: #ff3b30;
      
      /* Ambient Glows */
      --glow-green: 0 0 15px rgba(0, 255, 102, 0.35), 0 0 35px rgba(0, 255, 102, 0.15);
      --glow-purple: 0 0 15px rgba(182, 102, 255, 0.35), 0 0 35px rgba(182, 102, 255, 0.15);
      --glow-red: 0 0 15px rgba(255, 59, 48, 0.35), 0 0 35px rgba(255, 59, 48, 0.15);
      
      --glow-text-green: 0 0 8px rgba(0, 255, 102, 0.5), 0 0 25px rgba(0, 255, 102, 0.2);
      --glow-text-purple: 0 0 8px rgba(182, 102, 255, 0.5), 0 0 25px rgba(182, 102, 255, 0.2);
      --glow-text-red: 0 0 8px rgba(255, 59, 48, 0.5), 0 0 25px rgba(255, 59, 48, 0.2);

      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --transition-fast: 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg-black);
      color: #ffffff;
      font-family: var(--font-family);
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      align-items: center;
      justify-content: flex-start;
    }

    /* BACKGROUND AMBIENT GLOW */
    .ambient-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(182, 102, 255, 0.06) 0%, rgba(0, 255, 102, 0.02) 50%, rgba(0,0,0,0) 80%);
      pointer-events: none;
      z-index: -1;
    }

    /* GLASS CONTAINER */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 500px;
      width: 100%;
      padding: 1.5rem;
      overflow: hidden;
    }

    header {
      margin-bottom: 1.5rem;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      font-weight: 300;
      color: #ffffff;
      text-shadow: var(--glow-text-purple);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
    }

    /* GLOBAL SETTINGS */
    .global-settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .setting-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all var(--transition-fast);
    }
    .setting-card:active {
      transform: scale(0.97);
    }

    .setting-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 4px;
    }

    .setting-value {
      font-size: 1.3rem;
      font-weight: 300;
      color: #ffffff;
    }

    .setting-card.highlight-break .setting-value {
      color: var(--neon-red);
      text-shadow: 0 0 5px rgba(255, 59, 48, 0.3);
    }

    /* EXERCISE LIST SECTION */
    .exercise-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .section-title-bar {
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.4);
    }

    .exercise-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 2px;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100px;
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.85rem;
      text-align: center;
      padding: 20px;
    }

    /* EXERCISE ITEMS */
    .exercise-item {
      background: rgba(8, 8, 8, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      display: flex;
      align-items: center;
      padding: 12px 14px;
      gap: 12px;
      cursor: grab;
      transition: all var(--transition-fast);
    }

    .exercise-item.dragging {
      opacity: 0.4;
      cursor: grabbing;
      border: 1px dashed var(--neon-green);
    }

    .drag-handle {
      display: flex;
      flex-direction: column;
      gap: 3px;
      cursor: grab;
      color: rgba(255, 255, 255, 0.2);
      padding: 8px 4px;
      touch-action: none;
    }

    .drag-handle span {
      width: 14px;
      height: 1.5px;
      background-color: currentColor;
      border-radius: 1px;
    }

    .exercise-info {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .exercise-name-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      color: #ffffff;
      font-family: var(--font-family);
      font-size: 1rem;
      font-weight: 400;
      width: 100%;
      padding: 2px 0;
      outline: none;
      transition: var(--transition-fast);
      user-select: text;
      -webkit-user-select: text;
    }

    .exercise-name-input:focus {
      border-bottom-color: var(--neon-green);
      color: var(--neon-green);
      text-shadow: 0 0 5px rgba(0, 255, 102, 0.3);
    }

    .exercise-time-trigger {
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--neon-green);
      text-shadow: 0 0 5px rgba(0, 255, 102, 0.2);
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition-fast);
    }
    .exercise-time-trigger:hover {
      background: rgba(0, 255, 102, 0.04);
      border-color: rgba(0, 255, 102, 0.4);
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      transition: var(--transition-fast);
    }
    .delete-btn:hover {
      color: var(--neon-red);
      background: rgba(255, 59, 48, 0.05);
    }

    /* CONTROLS AREA */
    .controls-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: auto;
    }

    .summary-card {
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.4);
    }

    .summary-value {
      font-size: 1.4rem;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-add {
      background: transparent;
      border: 1px solid rgba(0, 255, 102, 0.5);
      border-radius: 50%;
      color: #ffffff;
      cursor: pointer;
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 300;
      transition: all var(--transition-fast);
      box-shadow: var(--glow-green);
    }
    .btn-add:active {
      transform: scale(0.92);
    }

    .btn-start {
      flex: 1;
      background: transparent;
      color: #ffffff;
      border: 1px solid rgba(0, 255, 102, 0.6);
      border-radius: 28px;
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      height: 54px;
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: var(--glow-green);
      text-shadow: 0 0 3px #ffffff;
    }
    .btn-start:hover:not(:disabled) {
      background: rgba(0, 255, 102, 0.1);
    }
    .btn-start:active {
      transform: scale(0.97);
    }
    .btn-start:disabled {
      border-color: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.15);
      box-shadow: none;
      text-shadow: none;
      cursor: not-allowed;
    }

    /* WHEEL PICKER MODAL (APPLE STYLE GLASS) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(4, 4, 4, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: rgba(15, 15, 15, 0.7);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      width: 100%;
      max-width: 500px;
      padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: var(--neon-green);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .wheel-picker-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
      position: relative;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .wheel-column {
      flex: 1;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      position: relative;
      padding: 80px 0;
    }
    .wheel-column::-webkit-scrollbar {
      display: none;
    }

    .wheel-scroll-track {
      display: flex;
      flex-direction: column;
    }

    .wheel-item {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.3);
      scroll-snap-align: center;
      transition: all 0.2s ease;
      scroll-margin: 80px 0;
    }

    .wheel-item.selected {
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 600;
      transform: scale(1.05);
    }

    .wheel-selection-indicator {
      position: absolute;
      top: 80px; left: 0; right: 0; height: 40px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      pointer-events: none;
      background: rgba(255, 255, 255, 0.01);
    }

    .wheel-fade-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(5, 5, 5, 0.95) 0%,
        rgba(5, 5, 5, 0.6) 20%,
        transparent 40%,
        transparent 60%,
        rgba(5, 5, 5, 0.6) 80%,
        rgba(5, 5, 5, 0.95) 100
      );
    }

    .picker-divider {
      font-size: 1.5rem;
      color: rgba(255, 255, 255, 0.2);
      margin: 0 10px;
    }

    /* FULLSCREEN WORKOUT TIMER OVERLAY */
    .timer-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-black);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 24px;
      padding-top: calc(40px + env(safe-area-inset-top));
      padding-bottom: calc(40px + env(safe-area-inset-bottom));
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      overscroll-behavior: none;
    }

    .timer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .timer-overlay.state-exercise {
      --theme-color: var(--neon-green);
      --theme-glow: var(--glow-text-green);
    }

    .timer-overlay.state-break {
      --theme-color: var(--neon-red);
      --theme-glow: var(--glow-text-red);
    }

    .timer-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .timer-cycle-count {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.4);
    }

    .timer-exercise-name {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 1px;
      color: var(--theme-color);
      text-shadow: var(--theme-glow);
      text-transform: uppercase;
      margin-top: 6px;
      transition: var(--transition-fast);
      word-wrap: break-word;
    }

    .timer-display-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
    }

    .timer-seconds {
      font-size: 6.5rem;
      font-weight: 100;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--theme-color);
      text-shadow: var(--theme-glow);
      transition: var(--transition-fast);
    }

    .overall-time-container {
      margin-top: 20px;
      text-align: center;
    }

    .overall-time-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.3);
      margin-bottom: 2px;
    }

    .overall-time-value {
      font-size: 1.2rem;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
    }

    .timer-footer {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .timer-btn-group {
      display: flex;
      gap: 14px;
      width: 100%;
      max-width: 400px;
    }

    .btn-timer-action {
      flex: 1;
      height: 52px;
      border-radius: 26px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all var(--transition-fast);
      background: transparent;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-timer-action:active {
      background: rgba(255, 255, 255, 0.05);
    }

    .btn-stop {
      border-color: rgba(255, 59, 48, 0.5);
      box-shadow: var(--glow-red);
    }
    .btn-stop:active {
      transform: scale(0.97);
    }

    .next-up-card {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
      text-align: center;
      max-width: 90%;
      word-wrap: break-word;
      letter-spacing: 0.5px;
    }

    .next-up-value {
      font-weight: 500;
      color: #ffffff;
    }

    /* FLASHING ANIMATIONS */
    .flash-short-exercise { animation: flash-short-green-anim 0.25s ease-out; }
    .flash-short-break { animation: flash-short-red-anim 0.25s ease-out; }
    .flash-long-exercise { animation: flash-long-green-anim 0.6s ease-out; }
    .flash-long-break { animation: flash-long-red-anim 0.6s ease-out; }

    @keyframes flash-short-green-anim { 0% { background-color: rgba(0, 255, 102, 0.15); } 100% { background-color: #000000; } }
    @keyframes flash-short-red-anim { 0% { background-color: rgba(255, 59, 48, 0.15); } 100% { background-color: #000000; } }
    @keyframes flash-long-green-anim { 0% { background-color: rgba(0, 255, 102, 0.4); } 100% { background-color: #000000; } }
    @keyframes flash-long-red-anim { 0% { background-color: rgba(255, 59, 48, 0.4); } 100% { background-color: #000000; } }

    [draggable="true"] {
      -webkit-user-drag: element;
    }

    @media (max-height: 700px) {
      .app-container { padding: 10px; }
      h1 { font-size: 1.6rem; margin-bottom: 8px; }
      .timer-seconds { font-size: 5rem; }
      .timer-exercise-name { font-size: 1.4rem; }
      .btn-add, .btn-start, .btn-timer-action { height: 46px; }
      .btn-add { width: 46px; }
    }
  </style>
</head>
<body>

  <audio id="native-beep-audio" preload="auto" playsinline></audio>
  <div class="ambient-glow"></div>

  <div class="app-container" id="app-setup-screen">
    <header>
      <h1>Neon Intervals</h1>
      
      <div class="global-settings">
        <div class="setting-card" id="setting-cycles" onclick="openCyclesPicker()">
          <span class="setting-label">Zyklen</span>
          <span class="setting-value" id="cycles-value">3</span>
        </div>
        <div class="setting-card highlight-break" id="setting-break" onclick="openBreakPicker()">
          <span class="setting-label">Pausenzeit</span>
          <span class="setting-value" id="break-value">00:30</span>
        </div>
      </div>
    </header>

    <main class="exercise-section">
      <div class="section-title-bar">
        <span class="section-title">Übungen</span>
      </div>
      <div class="exercise-list" id="exercise-list"></div>
    </main>

    <footer class="controls-container">
      <div class="summary-card">
        <span class="summary-label">Gesamtzeit</span>
        <span class="summary-value" id="total-duration-summary">00:00</span>
      </div>
      
      <div class="btn-group">
        <button class="btn-add" id="add-exercise-btn" onclick="addNewExercise()" aria-label="Übung hinzufügen">+</button>
        <button class="btn-start" id="start-timer-btn" onclick="startWorkout()" disabled>Start</button>
      </div>
    </footer>
  </div>

  <div class="modal-overlay" id="picker-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="picker-modal-title">Zeit einstellen</span>
        <button class="modal-close-btn" onclick="closePickerModal()">Fertig</button>
      </div>
      <div class="wheel-picker-container" id="wheel-picker-content"></div>
    </div>
  </div>

  <div class="timer-overlay" id="timer-overlay">
    <div class="timer-header">
      <span class="timer-cycle-count" id="running-cycle-label">Runde 1 / 3</span>
      <h2 class="timer-exercise-name" id="running-item-label">Kniebeugen</h2>
    </div>

    <div class="timer-display-container">
      <div class="timer-seconds" id="running-timer-seconds">00:45</div>
      
      <div class="overall-time-container">
        <div class="overall-time-label">Gesamte Restzeit</div>
        <div class="overall-time-value" id="running-overall-time">05:15</div>
      </div>
    </div>

    <div class="timer-footer">
      <div class="next-up-card" id="next-up-card">
        Nächste Übung: <span class="next-up-value" id="running-next-item">Liegestütze</span>
      </div>
      
      <div class="timer-btn-group">
        <button class="btn-timer-action" id="timer-pause-btn" onclick="togglePauseWorkout()">Pause</button>
        <button class="btn-timer-action" id="timer-skip-btn" onclick="skipCurrentStep()">Weiter</button>
        <button class="btn-timer-action btn-stop" onclick="stopWorkout()">Beenden</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      let exercises = [
        { id: 'ex-1', name: 'Kniebeugen', minutes: 0, seconds: 45 },
        { id: 'ex-2', name: 'Liegestütze', minutes: 0, seconds: 30 },
        { id: 'ex-3', name: 'Plank', minutes: 0, seconds: 45 }
      ];

      let globalBreak = { minutes: 0, seconds: 15 };
      let cycles = 3;

      let timer = {
        intervalId: null,
        state: 'setup', 
        playlist: [],
        currentStepIndex: 0,
        stepSecondsRemaining: 0,
        overallSecondsRemaining: 0
      };

      const BEEP_SOUND_SRC = "data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU92T19fX19fX19fX35+fn5+fn5+fn9/f39/f39/f3+AgICAgICAgIBehaviorfX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX19fX2dnZ2dnZ2dnZ2dnZ39/f39/f39/f39/f4CAgICAgICAgICAf39/f39/f39/f39/f2dnZ2dnZ2dnZ2dnZw==";

      let activePicker = { type: null, targetId: null };

      let exerciseListContainer, totalDurationSummary, startTimerBtn, cyclesValueDisplay, breakValueDisplay;
      let pickerModal, pickerModalTitle, wheelPickerContent, timerOverlay, runningCycleLabel;
      let runningItemLabel, runningTimerSeconds, runningOverallTime, runningNextItem, nextUpCard, timerPauseBtn, nativeAudioElement;

      function saveToLocalStorage() {
        localStorage.setItem('neon_intervals_exercises', JSON.stringify(exercises));
        localStorage.setItem('neon_intervals_break', JSON.stringify(globalBreak));
        localStorage.setItem('neon_intervals_cycles', cycles);
      }

      function loadFromLocalStorage() {
        const localEx = localStorage.getItem('neon_intervals_exercises');
        const localBreak = localStorage.getItem('neon_intervals_break');
        const localCycles = localStorage.getItem('neon_intervals_cycles');

        if (localEx) exercises = JSON.parse(localEx);
        if (localBreak) globalBreak = JSON.parse(localBreak);
        if (localCycles) cycles = parseInt(localCycles, 10);
      }

      function init() {
        loadFromLocalStorage();

        exerciseListContainer = document.getElementById('exercise-list');
        totalDurationSummary = document.getElementById('total-duration-summary');
        startTimerBtn = document.getElementById('start-timer-btn');
        cyclesValueDisplay = document.getElementById('cycles-value');
        breakValueDisplay = document.getElementById('break-value');
        pickerModal = document.getElementById('picker-modal');
        pickerModalTitle = document.getElementById('picker-modal-title');
        wheelPickerContent = document.getElementById('wheel-picker-content');
        timerOverlay = document.getElementById('timer-overlay');
        runningCycleLabel = document.getElementById('running-cycle-label');
        runningItemLabel = document.getElementById('running-item-label');
        runningTimerSeconds = document.getElementById('running-timer-seconds');
        runningOverallTime = document.getElementById('running-overall-time');
        runningNextItem = document.getElementById('running-next-item');
        nextUpCard = document.getElementById('next-up-card');
        timerPauseBtn = document.getElementById('timer-pause-btn');
        nativeAudioElement = document.getElementById('native-beep-audio');

        if (nativeAudioElement) nativeAudioElement.src = BEEP_SOUND_SRC;

        document.addEventListener('touchmove', function(e) {
          if (!e.target.closest('#exercise-list') && !e.target.closest('.wheel-column')) {
            e.preventDefault();
          }
        }, { passive: false });

        renderExerciseList();
        updateSummary();
        initDragAndDrop();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      function formatTime(mins, secs) {
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      function formatSeconds(totalSeconds) {
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        return formatTime(mins, secs);
      }

      function renderExerciseList() {
        if (!exerciseListContainer) return;
        exerciseListContainer.innerHTML = '';
        
        if (exercises.length === 0) {
          exerciseListContainer.innerHTML = `<div class="empty-state">Keine Übungen vorhanden. Tippe auf "+", um eine Übung hinzuzufügen.</div>`;
          if (startTimerBtn) startTimerBtn.disabled = true;
          return;
        }
        
        if (startTimerBtn) startTimerBtn.disabled = false;

        exercises.forEach((ex) => {
          const item = document.createElement('div');
          item.className = 'exercise-item';
          item.draggable = true;
          item.dataset.id = ex.id;
          
          item.innerHTML = `
            <div class="drag-handle" title="Reihenfolge ändern">
              <span></span><span></span><span></span>
            </div>
            <div class="exercise-info">
              <input 
                type="text" 
                class="exercise-name-input" 
                value="${ex.name}" 
                placeholder="Name der Übung"
                onchange="window.renameExercise('${ex.id}', this.value)"
              />
              <div class="exercise-time-trigger" onclick="window.openExerciseTimePicker('${ex.id}')">
                ${formatTime(ex.minutes, ex.seconds)}
              </div>
            </div>
            <button class="delete-btn" onclick="window.deleteExercise('${ex.id}')" aria-label="Löschen">✕</button>
          `;
          exerciseListContainer.appendChild(item);
        });
      }

      function addNewExercise() {
        const id = 'ex-' + Date.now();
        exercises.push({ id: id, name: `Übung ${exercises.length + 1}`, minutes: 0, seconds: 45 });
        saveToLocalStorage();
        renderExerciseList();
        updateSummary();
        
        setTimeout(() => {
          const input = exerciseListContainer.querySelector(`[data-id="${id}"] .exercise-name-input`);
          if (input) { input.focus(); input.select(); }
        }, 50);
      }

      function renameExercise(id, newName) {
        const index = exercises.findIndex(ex => ex.id === id);
        if (index !== -1) {
          exercises[index].name = newName.trim() || `Übung ${index + 1}`;
          saveToLocalStorage();
          renderExerciseList();
        }
      }

      function deleteExercise(id) {
        exercises = exercises.filter(ex => ex.id !== id);
        saveToLocalStorage();
        renderExerciseList();
        updateSummary();
      }

      /* DRAG & DROP IMPLEMENTATION */
      let draggedElement = null;

      function initDragAndDrop() {
        try {
          exerciseListContainer.addEventListener('dragstart', (e) => {
            const item = e.target.closest('.exercise-item');
            if (!item) return;
            draggedElement = item;
            item.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
          });

          exerciseListContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (!draggedElement) return;
            const container = exerciseListContainer;
            const afterElement = getDragAfterElement(container, e.clientY);
            if (afterElement == null) {
              container.appendChild(draggedElement);
            } else {
              container.insertBefore(draggedElement, afterElement);
            }
          });

          exerciseListContainer.addEventListener('dragend', (e) => {
            if (!draggedElement) return;
            draggedElement.classList.remove('dragging');
            draggedElement = null;
            saveListOrderFromDOM();
          });

          /* Mobile D&D Touch Engine */
          let touchStartElement = null;
          exerciseListContainer.addEventListener('touchstart', (e) => {
            const handle = e.target.closest('.drag-handle');
            if (!handle) return; 
            const item = handle.closest('.exercise-item');
            if (!item) return;
            touchStartElement = item;
            item.classList.add('dragging');
            e.preventDefault();
          }, { passive: false });

          document.addEventListener('touchmove', (e) => {
            if (!touchStartElement) return;
            e.preventDefault();
            const touch = e.touches[0];
            const elementAtPoint = document.elementFromPoint(touch.clientX, touch.clientY);
            if (!elementAtPoint) return;
            
            const targetItem = elementAtPoint.closest('.exercise-item');
            if (targetItem && targetItem !== touchStartElement && targetItem.parentNode === exerciseListContainer) {
              const box = targetItem.getBoundingClientRect();
              const midPoint = box.top + box.height / 2;
              if (touch.clientY < midPoint) {
                exerciseListContainer.insertBefore(touchStartElement, targetItem);
              } else {
                exerciseListContainer.insertBefore(touchStartElement, targetItem.nextSibling);
              }
            }
          }, { passive: false });

          document.addEventListener('touchend', () => {
            if (!touchStartElement) return;
            touchStartElement.classList.remove('dragging');
            touchStartElement = null;
            saveListOrderFromDOM();
          });
        } catch (err) {
          console.warn('D&D Error:', err);
        }
      }

      function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.exercise-item:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
          const box = child.getBoundingClientRect();
          const offset = y - box.top - box.height / 2;
          if (offset < 0 && offset > closest.offset) {
            return { offset: offset, element: child };
          } else {
            return closest;
          }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
      }

      function saveListOrderFromDOM() {
        const items = [...exerciseListContainer.querySelectorAll('.exercise-item')];
        exercises = items.map(item => exercises.find(ex => ex.id === item.dataset.id)).filter(Boolean);
        saveToLocalStorage();
        updateSummary();
      }

      function calculateTotalDuration() {
        if (exercises.length === 0) return 0;
        let exerciseSeconds = 0;
        exercises.forEach(ex => exerciseSeconds += (ex.minutes * 60) + ex.seconds);
        const totalExerciseSteps = exercises.length * cycles;
        const totalBreakSteps = Math.max(0, totalExerciseSteps - 1);
        const breakSeconds = (globalBreak.minutes * 60) + globalBreak.seconds;
        return (exerciseSeconds * cycles) + (totalBreakSteps * breakSeconds);
      }

      function updateSummary() {
        const totalSeconds = calculateTotalDuration();
        if (totalDurationSummary) totalDurationSummary.innerText = formatSeconds(totalSeconds);
        if (cyclesValueDisplay) cyclesValueDisplay.innerText = cycles;
        if (breakValueDisplay) breakValueDisplay.innerText = formatTime(globalBreak.minutes, globalBreak.seconds);
      }

      /* WHEEL PICKER CONSTRUCTOR */
      function createWheelColumn(id, label, min, max, initialValue, step = 1) {
        const column = document.createElement('div');
        column.className = 'wheel-column';
        column.id = id;
        
        const scrollTrack = document.createElement('div');
        scrollTrack.className = 'wheel-scroll-track';
        
        for (let i = min; i <= max; i += step) {
          const item = document.createElement('div');
          item.className = 'wheel-item';
          item.dataset.value = i;
          item.innerText = String(i).padStart(2, '0');
          scrollTrack.appendChild(item);
        }
        
        column.appendChild(scrollTrack);
        column.addEventListener('scroll', () => updateSelectedClass(column));
        return column;
      }

      function updateSelectedClass(column) {
        const items = column.querySelectorAll('.wheel-item');
        const columnRect = column.getBoundingClientRect();
        const centerY = columnRect.top + columnRect.height / 2;
        
        let closestItem = null;
        let minDistance = Infinity;
        
        items.forEach(item => {
          const rect = item.getBoundingClientRect();
          const itemCenterY = rect.top + rect.height / 2;
          const distance = Math.abs(centerY - itemCenterY);
          if (distance < minDistance) {
            minDistance = distance;
            closestItem = item;
          }
        });
        
        items.forEach(item => {
          if (item === closestItem) item.classList.add('selected');
          else item.classList.remove('selected');
        });
      }

      function selectWheelValue(column, value) {
        const items = column.querySelectorAll('.wheel-item');
        let selectedIndex = 0;
        items.forEach((item, idx) => {
          if (parseInt(item.dataset.value) === value) selectedIndex = idx;
        });
        
        setTimeout(() => {
          column.scrollTop = selectedIndex * 40;
          updateSelectedClass(column);
        }, 40);
      }

      function getSelectedWheelValue(columnId) {
        const column = document.getElementById(columnId);
        if (!column) return 0;
        
        const items = column.querySelectorAll('.wheel-item');
        const columnRect = column.getBoundingClientRect();
        const centerY = columnRect.top + columnRect.height / 2;
        
        let closestItem = null;
        let minDistance = Infinity;
        
        items.forEach(item => {
          const rect = item.getBoundingClientRect();
          const itemCenterY = rect.top + rect.height / 2;
          const distance = Math.abs(centerY - itemCenterY);
          if (distance < minDistance) {
            minDistance = distance;
            closestItem = item;
          }
        });
        return closestItem ? parseInt(closestItem.dataset.value) : 0;
      }

      function openCyclesPicker() {
        activePicker.type = 'cycles';
        pickerModalTitle.innerText = 'Runden wählen';
        wheelPickerContent.innerHTML = '<div class="wheel-selection-indicator"></div>';
        const cyclesCol = createWheelColumn('cycles-column', 'Runden', 1, 99, cycles);
        wheelPickerContent.appendChild(cyclesCol);
        wheelPickerContent.appendChild(document.createElement('div')).className = 'wheel-fade-overlay';
        pickerModal.classList.add('active');
        selectWheelValue(cyclesCol, cycles);
      }

      function openBreakPicker() {
        activePicker.type = 'break';
        pickerModalTitle.innerText = 'Pausenzeit wählen';
        wheelPickerContent.innerHTML = '<div class="wheel-selection-indicator"></div>';
        const minCol = createWheelColumn('min-column', 'Min', 0, 59, globalBreak.minutes);
        const divider = document.createElement('div');
        divider.className = 'picker-divider'; divider.innerText = ':';
        const secCol = createWheelColumn('sec-column', 'Sec', 0, 59, globalBreak.seconds);
        
        wheelPickerContent.appendChild(minCol);
        wheelPickerContent.appendChild(divider);
        wheelPickerContent.appendChild(secCol);
        wheelPickerContent.appendChild(document.createElement('div')).className = 'wheel-fade-overlay';
        pickerModal.classList.add('active');
        selectWheelValue(minCol, globalBreak.minutes);
        selectWheelValue(secCol, globalBreak.seconds);
      }

      function openExerciseTimePicker(id) {
        const ex = exercises.find(item => item.id === id);
        if (!ex) return;
        activePicker.type = 'exercise'; activePicker.targetId = id;
        pickerModalTitle.innerText = `${ex.name} - Zeit`;
        wheelPickerContent.innerHTML = '<div class="wheel-selection-indicator"></div>';
        const minCol = createWheelColumn('min-column', 'Min', 0, 59, ex.minutes);
        const divider = document.createElement('div');
        divider.className = 'picker-divider'; divider.innerText = ':';
        const secCol = createWheelColumn('sec-column', 'Sec', 0, 59, ex.seconds);
        
        wheelPickerContent.appendChild(minCol);
        wheelPickerContent.appendChild(divider);
        wheelPickerContent.appendChild(secCol);
        wheelPickerContent.appendChild(document.createElement('div')).className = 'wheel-fade-overlay';
        pickerModal.classList.add('active');
        selectWheelValue(minCol, ex.minutes);
        selectWheelValue(secCol, ex.seconds);
      }

      function closePickerModal() {
        if (activePicker.type === 'cycles') {
          cycles = getSelectedWheelValue('cycles-column') || 1;
        } else if (activePicker.type === 'break') {
          globalBreak.minutes = getSelectedWheelValue('min-column');
          globalBreak.seconds = getSelectedWheelValue('sec-column');
          if (globalBreak.minutes === 0 && globalBreak.seconds === 0) globalBreak.seconds = 5;
        } else if (activePicker.type === 'exercise' && activePicker.targetId) {
          const ex = exercises.find(item => item.id === activePicker.targetId);
          if (ex) {
            ex.minutes = getSelectedWheelValue('min-column');
            ex.seconds = getSelectedWheelValue('sec-column');
            if (ex.minutes === 0 && ex.seconds === 0) ex.seconds = 10;
          }
        }
        saveToLocalStorage();
        pickerModal.classList.remove('active');
        activePicker.type = null; activePicker.targetId = null;
        renderExerciseList();
        updateSummary();
      }

      /* SAFE MEDIA CHANNELS ENGINE FOR IOS */
      function playBeep() {
        if (!nativeAudioElement) return;
        nativeAudioElement.pause();
        nativeAudioElement.currentTime = 0;
        nativeAudioElement.volume = 1.0;
        const playPromise = nativeAudioElement.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => console.warn("Media Engine blocked:", error));
        }
      }

      function unlockAudio() {
        if (!nativeAudioElement) return;
        nativeAudioElement.play().then(() => {
          nativeAudioElement.pause();
          nativeAudioElement.currentTime = 0;
        }).catch(() => {});
      }

      /* TIMER ENGINE CORE */
      function startWorkout() {
        if (exercises.length === 0) return;
        unlockAudio();
        
        timer.playlist = [];
        const breakSeconds = (globalBreak.minutes * 60) + globalBreak.seconds;
        
        for (let c = 1; c <= cycles; c++) {
          exercises.forEach((ex, idx) => {
            timer.playlist.push({
              type: 'exercise', name: ex.name, duration: (ex.minutes * 60) + ex.seconds, cycle: c
            });
            if (!(c === cycles && idx === exercises.length - 1)) {
              timer.playlist.push({
                type: 'break', name: 'Pause', duration: breakSeconds, cycle: c
              });
            }
          });
        }
        
        timer.currentStepIndex = 0;
        timer.stepSecondsRemaining = timer.playlist[0].duration;
        timer.overallSecondsRemaining = timer.playlist.reduce((sum, step) => sum + step.duration, 0);
        
        timer.state = 'running';
        if (timerPauseBtn) timerPauseBtn.innerText = 'Pause';
        if (timerOverlay) timerOverlay.classList.add('active');
        document.getElementById('app-setup-screen').style.display = 'none';
        
        updateTimerUI();
        clearInterval(timer.intervalId);
        timer.intervalId = setInterval(tick, 1000);
      }

      function tick() {
        if (timer.state !== 'running') return;
        
        timer.stepSecondsRemaining--;
        timer.overallSecondsRemaining--;
        
        const currentStep = timer.playlist[timer.currentStepIndex];
        if (timer.stepSecondsRemaining >= 1 && timer.stepSecondsRemaining <= 3) {
          playBeep();
          triggerScreenFlash('short', currentStep.type);
        }
        
        if (timer.stepSecondsRemaining <= 0) {
          triggerScreenFlash('long', currentStep.type);
          playBeep();
          timer.currentStepIndex++;
          
          if (timer.currentStepIndex >= timer.playlist.length) {
            clearInterval(timer.intervalId);
            timer.state = 'setup';
            playBeep();
            setTimeout(playBeep, 200);
            setTimeout(playBeep, 400);
            
            setTimeout(() => {
              if (timerOverlay) timerOverlay.classList.remove('active');
              document.getElementById('app-setup-screen').style.display = 'flex';
            }, 1000);
            return;
          }
          timer.stepSecondsRemaining = timer.playlist[timer.currentStepIndex].duration;
        }
        updateTimerUI();
      }

      function triggerScreenFlash(intensity, type) {
        if (!timerOverlay) return;
        timerOverlay.classList.remove('flash-short-exercise', 'flash-short-break', 'flash-long-exercise', 'flash-long-break');
        void timerOverlay.offsetWidth;
        timerOverlay.classList.add(`flash-${intensity}-${type}`);
      }

      function updateTimerUI() {
        if (!timerOverlay) return;
        const currentStep = timer.playlist[timer.currentStepIndex];
        
        if (currentStep.type === 'exercise') {
          timerOverlay.classList.remove('state-break'); timerOverlay.classList.add('state-exercise');
        } else {
          timerOverlay.classList.remove('state-exercise'); timerOverlay.classList.add('state-break');
        }
        
        if (runningCycleLabel) runningCycleLabel.innerText = `Runde ${currentStep.cycle} / ${cycles}`;
        if (runningItemLabel) runningItemLabel.innerText = currentStep.name;
        if (runningTimerSeconds) runningTimerSeconds.innerText = formatSeconds(timer.stepSecondsRemaining);
        if (runningOverallTime) runningOverallTime.innerText = formatSeconds(timer.overallSecondsRemaining);
        
        let nextExercise = timer.playlist.slice(timer.currentStepIndex + 1).find(step => step.type === 'exercise');
        if (nextExercise) {
          if (nextUpCard) nextUpCard.style.display = 'block';
          if (runningNextItem) runningNextItem.innerText = `${nextExercise.name} (${formatSeconds(nextExercise.duration)})`;
        } else {
          if (nextUpCard) nextUpCard.style.display = 'none';
        }
      }

      function togglePauseWorkout() {
        if (timer.state === 'running') {
          timer.state = 'paused'; if (timerPauseBtn) timerPauseBtn.innerText = 'Fortsetzen';
        } else if (timer.state === 'paused') {
          timer.state = 'running'; if (timerPauseBtn) timerPauseBtn.innerText = 'Pause';
        }
      }

      function stopWorkout() {
        clearInterval(timer.intervalId);
        timer.state = 'setup';
        if (timerOverlay) {
          timerOverlay.classList.remove('active', 'flash-short-exercise', 'flash-short-break', 'flash-long-exercise', 'flash-long-break');
        }
        document.getElementById('app-setup-screen').style.display = 'flex';
      }

      function skipCurrentStep() {
        if (timer.state === 'setup') return;
        playBeep();
        triggerScreenFlash('long', timer.playlist[timer.currentStepIndex].type);
        timer.currentStepIndex++;
        
        if (timer.currentStepIndex >= timer.playlist.length) {
          clearInterval(timer.intervalId); timer.state = 'setup'; playBeep();
          setTimeout(() => {
            if (timerOverlay) timerOverlay.classList.remove('active');
            document.getElementById('app-setup-screen').style.display = 'flex';
          }, 500);
          return;
        }
        timer.overallSecondsRemaining -= timer.stepSecondsRemaining;
        if (timer.overallSecondsRemaining < 0) timer.overallSecondsRemaining = 0;
        timer.stepSecondsRemaining = timer.playlist[timer.currentStepIndex].duration;
        updateTimerUI();
      }

      window.addNewExercise = addNewExercise;
      window.renameExercise = renameExercise;
      window.deleteExercise = deleteExercise;
      window.openCyclesPicker = openCyclesPicker;
      window.openBreakPicker = openBreakPicker;
      window.openExerciseTimePicker = openExerciseTimePicker;
      window.closePickerModal = closePickerModal;
      window.startWorkout = startWorkout;
      window.togglePauseWorkout = togglePauseWorkout;
      window.stopWorkout = stopWorkout;
      window.skipCurrentStep = skipCurrentStep;
    })();
  </script>
</body>
