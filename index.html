<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Intervals</title>
  <link rel="icon" type="image/jpeg" href="Training.jpeg">
  <link rel="apple-touch-icon" href="Training.jpeg">
  <style>
    /* CSS Reset & Variables */
    :root {
      --bg-color: #000000;
      --text-color: #ffffff;
      --text-muted: #888888;
      --text-dark: #333333;
      --neon-green: #00ff66;
      --neon-green-glow: 0 0 10px rgba(0, 255, 102, 0.6), 0 0 25px rgba(0, 255, 102, 0.3);
      --neon-red: #ff3b30;
      --neon-red-glow: 0 0 10px rgba(255, 59, 48, 0.6), 0 0 25px rgba(255, 59, 48, 0.3);
      --neon-gray: #1c1c1e;
      --border-color: #2c2c2e;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      overflow-x: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 2px;
    }

    /* Layout Containers */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
      position: relative;
    }

    h1 {
      font-size: 28px;
      font-weight: 200;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-color);
      margin-bottom: 20px;
    }

    /* Global Settings */
    .global-settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 10px;
    }

    .setting-card {
      background: var(--neon-gray);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .setting-card:active {
      transform: scale(0.97);
    }

    .setting-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .setting-value {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-color);
      transition: var(--transition);
    }

    .setting-card.highlight-break .setting-value {
      color: var(--neon-red);
      text-shadow: 0 0 5px rgba(255, 59, 48, 0.4);
    }

    /* Exercise List Section */
    .exercise-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .section-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .section-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
    }

    .exercise-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 2px;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100px;
      border: 1px dashed var(--border-color);
      border-radius: 12px;
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      padding: 20px;
    }

    /* Exercise Items */
    .exercise-item {
      background: var(--neon-gray);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 14px 16px;
      gap: 12px;
      cursor: grab;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      position: relative;
    }

    .exercise-item.dragging {
      opacity: 0.4;
      cursor: grabbing;
      border: 1px dashed var(--neon-green);
    }

    .drag-handle {
      display: flex;
      flex-direction: column;
      gap: 3px;
      cursor: grab;
      color: var(--text-muted);
      padding: 10px 6px;
      touch-action: none;
    }

    .drag-handle span {
      width: 16px;
      height: 2px;
      background-color: currentColor;
      border-radius: 1px;
    }

    .exercise-info {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .exercise-name-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      color: var(--text-color);
      font-family: var(--font-family);
      font-size: 16px;
      font-weight: 500;
      width: 100%;
      padding: 2px 0;
      outline: none;
      transition: var(--transition);
      user-select: text;
      -webkit-user-select: text;
    }

    .exercise-name-input:focus {
      border-bottom-color: var(--neon-green);
      color: var(--neon-green);
      text-shadow: 0 0 5px rgba(0, 255, 102, 0.3);
    }

    .exercise-time-trigger {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--neon-green);
      text-shadow: 0 0 5px rgba(0, 255, 102, 0.3);
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
    }

    .exercise-time-trigger:hover {
      background: rgba(0, 255, 102, 0.08);
      border-color: var(--neon-green);
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      transition: var(--transition);
    }

    .delete-btn:hover {
      color: var(--neon-red);
      background: rgba(255, 59, 48, 0.1);
    }

    /* Control Controls */
    .controls-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: auto;
    }

    .summary-card {
      border-top: 1px solid var(--border-color);
      padding-top: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary-label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
    }

    .summary-value {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .btn-add {
      background: transparent;
      border: 2px solid var(--neon-green);
      border-radius: 50%;
      color: var(--neon-green);
      cursor: pointer;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 300;
      transition: var(--transition);
      box-shadow: var(--neon-green-glow);
    }

    .btn-add:active {
      transform: scale(0.92);
    }

    .btn-start {
      flex: 1;
      background: var(--neon-green);
      color: #000000;
      border: none;
      border-radius: 28px;
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      height: 56px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--neon-green-glow);
    }

    .btn-start:active {
      transform: scale(0.97);
    }

    .btn-start:disabled {
      background: var(--border-color);
      color: var(--text-muted);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Apple-style Custom Wheel Picker Overlay Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #121212;
      border-top: 1px solid var(--border-color);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      width: 100%;
      max-width: 600px;
      padding: 24px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: var(--neon-green);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Wheel Picker Component Styling */
    .wheel-picker-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
      position: relative;
      overflow: hidden;
      background: #090909;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .wheel-column {
      flex: 1;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none; /* Firefox */
      position: relative;
      padding: 80px 0; /* Align first/last elements with snap center */
    }

    .wheel-column::-webkit-scrollbar {
      display: none; /* Safari / Chrome */
    }

    .wheel-scroll-track {
      display: flex;
      flex-direction: column;
    }

    .wheel-item {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--text-muted);
      scroll-snap-align: center;
      transition: color 0.2s, font-size 0.2s, transform 0.2s;
      scroll-margin: 80px 0;
    }

    .wheel-item.selected {
      color: var(--text-color);
      font-size: 24px;
      font-weight: 700;
      transform: scale(1.1);
    }

    /* Visual guides and 3D fading masks for the Wheel Picker */
    .wheel-selection-indicator {
      position: absolute;
      top: 80px;
      left: 0;
      right: 0;
      height: 40px;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      pointer-events: none;
      background: rgba(255, 255, 255, 0.02);
    }

    .wheel-column-label {
      position: absolute;
      right: 20%;
      pointer-events: none;
      font-size: 14px;
      font-weight: bold;
      color: var(--text-muted);
    }

    .wheel-fade-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(9, 9, 9, 0.95) 0%,
        rgba(9, 9, 9, 0.6) 20%,
        transparent 40%,
        transparent 60%,
        rgba(9, 9, 9, 0.6) 80%,
        rgba(9, 9, 9, 0.95) 100%
      );
    }

    .picker-divider {
      font-size: 28px;
      color: var(--text-muted);
      margin: 0 10px;
    }

    /* Fullscreen Workout Timer Overlay */
    .timer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-color);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .timer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Colors and Glows based on state (Exercise vs Break) */
    .timer-overlay.state-exercise {
      --theme-color: var(--neon-green);
      --theme-glow: var(--neon-green-glow);
    }

    .timer-overlay.state-break {
      --theme-color: var(--neon-red);
      --theme-glow: var(--neon-red-glow);
    }

    .timer-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .timer-cycle-count {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--text-muted);
    }

    .timer-exercise-name {
      font-size: 32px;
      font-weight: 300;
      letter-spacing: 1px;
      color: var(--theme-color);
      text-shadow: var(--theme-glow);
      text-transform: uppercase;
      margin-top: 10px;
      transition: var(--transition);
      word-wrap: break-word;
      max-width: 100%;
    }

    .timer-display-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      position: relative;
    }

    .timer-seconds {
      font-size: 130px;
      font-weight: 100;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--theme-color);
      text-shadow: var(--theme-glow);
      transition: var(--transition);
    }

    /* Secondary/Overall Countdown display */
    .overall-time-container {
      margin-top: 15px;
      text-align: center;
    }

    .overall-time-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .overall-time-value {
      font-size: 20px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text-color);
    }

    .timer-footer {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .timer-btn-group {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 400px;
    }

    .btn-timer-action {
      flex: 1;
      height: 56px;
      border-radius: 28px;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-pause, .btn-skip {
      background: transparent;
      border: 2px solid var(--text-color);
      color: var(--text-color);
    }

    .btn-pause:active, .btn-skip:active {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-stop {
      background: var(--neon-red);
      border: none;
      color: #ffffff;
      box-shadow: var(--neon-red-glow);
    }

    .btn-stop:active {
      transform: scale(0.97);
    }

    /* Next Up hint */
    .next-up-card {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      max-width: 80%;
      word-wrap: break-word;
    }

    .next-up-value {
      font-weight: 600;
      color: var(--text-color);
    }

    /* Screen Flashing Keyframes and Utility classes */
    .flash-short-exercise { animation: flash-short-green-anim 0.25s ease-out; }
    .flash-short-break { animation: flash-short-red-anim 0.25s ease-out; }
    .flash-long-exercise { animation: flash-long-green-anim 0.6s ease-out; }
    .flash-long-break { animation: flash-long-red-anim 0.6s ease-out; }

    @keyframes flash-short-green-anim {
      0% { background-color: #00401a; }
      100% { background-color: #000000; }
    }
    @keyframes flash-short-red-anim {
      0% { background-color: #400f0c; }
      100% { background-color: #000000; }
    }
    @keyframes flash-long-green-anim {
      0% { background-color: #00b347; }
      100% { background-color: #000000; }
    }
    @keyframes flash-long-red-anim {
      0% { background-color: #b32922; }
      100% { background-color: #000000; }
    }

    /* Support dragging cursor visuals */
    [draggable="true"] {
      -webkit-user-drag: element;
    }

    /* Responsive adjustments */
    @media (max-height: 700px) {
      .app-container {
        padding: 10px;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 12px;
      }
      .global-settings {
        margin-bottom: 8px;
      }
      .setting-card {
        padding: 8px 12px;
      }
      .timer-seconds {
        font-size: 90px;
      }
      .timer-exercise-name {
        font-size: 24px;
      }
      .btn-add, .btn-start, .btn-timer-action {
        height: 48px;
      }
      .btn-add {
        width: 48px;
      }
    }
  </style>
</head>
<body>

  <audio id="silent-audio-bypass" loop playsinline src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==:"></audio>

  <div class="app-container" id="app-setup-screen">
    <header>
      <h1>Neon Intervals</h1>
      
      <div class="global-settings">
        <div class="setting-card" id="setting-cycles" onclick="openCyclesPicker()">
          <span class="setting-label">Zyklen</span>
          <span class="setting-value" id="cycles-value">3</span>
        </div>
        <div class="setting-card highlight-break" id="setting-break" onclick="openBreakPicker()">
          <span class="setting-label">Pausenzeit</span>
          <span class="setting-value" id="break-value">00:30</span>
        </div>
      </div>
    </header>

    <main class="exercise-section">
      <div class="section-title-bar">
        <span class="section-title">Übungen</span>
      </div>
      
      <div class="exercise-list" id="exercise-list">
      </div>
    </main>

    <footer class="controls-container">
      <div class="summary-card">
        <span class="summary-label">Gesamtzeit</span>
        <span class="summary-value" id="total-duration-summary">00:00</span>
      </div>
      
      <div class="btn-group">
        <button class="btn-add" id="add-exercise-btn" onclick="addNewExercise()" aria-label="Übung hinzufügen">+</button>
        <button class="btn-start" id="start-timer-btn" onclick="startWorkout()" disabled>Start</button>
      </div>
    </footer>
  </div>

  <div class="modal-overlay" id="picker-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="picker-modal-title">Zeit einstellen</span>
        <button class="modal-close-btn" onclick="closePickerModal()">Fertig</button>
      </div>
      
      <div class="wheel-picker-container" id="wheel-picker-content">
      </div>
    </div>
  </div>

  <div class="timer-overlay" id="timer-overlay">
    <div class="timer-header">
      <span class="timer-cycle-count" id="running-cycle-label">Runde 1 / 3</span>
      <h2 class="timer-exercise-name" id="running-item-label">Kniebeugen</h2>
    </div>

    <div class="timer-display-container">
      <div class="timer-seconds" id="running-timer-seconds">00:45</div>
      
      <div class="overall-time-container">
        <div class="overall-time-label">Gesamte Restzeit</div>
        <div class="overall-time-value" id="running-overall-time">05:15</div>
      </div>
    </div>

    <div class="timer-footer">
      <div class="next-up-card" id="next-up-card">
        Nächste Übung: <span class="next-up-value" id="running-next-item">Liegestütze</span>
      </div>
      
      <div class="timer-btn-group">
        <button class="btn-timer-action btn-pause" id="timer-pause-btn" onclick="togglePauseWorkout()">Pause</button>
        <button class="btn-timer-action btn-skip" id="timer-skip-btn" onclick="skipCurrentStep()">Weiter</button>
        <button class="btn-timer-action btn-stop" onclick="stopWorkout()">Beenden</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // --- State Management ---
      let exercises = [
        { id: 'ex-1', name: 'Kniebeugen', minutes: 0, seconds: 45 },
        { id: 'ex-2', name: 'Liegestütze', minutes: 0, seconds: 30 },
        { id: 'ex-3', name: 'Plank', minutes: 0, seconds: 45 }
      ];

      let globalBreak = { minutes: 0, seconds: 15 };
      let cycles = 3;

      // Timer State
      let timer = {
        intervalId: null,
        state: 'setup', // 'setup', 'running', 'paused'
        playlist: [],
        currentStepIndex: 0,
        stepSecondsRemaining: 0,
        overallSecondsRemaining: 0,
        audioContext: null
      };

      // Current Picker Configuration
      let activePicker = {
        type: null, // 'cycles', 'break', 'exercise'
        targetId: null // exercise ID if type is 'exercise'
      };

      // --- DOM Elements ---
      let exerciseListContainer;
      let totalDurationSummary;
      let startTimerBtn;
      let cyclesValueDisplay;
      let breakValueDisplay;

      // Picker Elements
      let pickerModal;
      let pickerModalTitle;
      let wheelPickerContent;

      // Timer Screen Elements
      let timerOverlay;
      let runningCycleLabel;
      let runningItemLabel;
      let runningTimerSeconds;
      let runningOverallTime;
      let runningNextItem;
      let nextUpCard;
      let timerPauseBtn;
      let silentAudioBypass;

      // --- LocalStorage Helpers ---
      function saveToLocalStorage() {
        localStorage.setItem('neon_intervals_exercises', JSON.stringify(exercises));
        localStorage.setItem('neon_intervals_break', JSON.stringify(globalBreak));
        localStorage.setItem('neon_intervals_cycles', cycles);
      }

      function loadFromLocalStorage() {
        const localEx = localStorage.getItem('neon_intervals_exercises');
        const localBreak = localStorage.getItem('neon_intervals_break');
        const localCycles = localStorage.getItem('neon_intervals_cycles');

        if (localEx) exercises = JSON.parse(localEx);
        if (localBreak) globalBreak = JSON.parse(localBreak);
        if (localCycles) cycles = parseInt(localCycles, 10);
      }

      // --- Alignment with iOS Setup ---
      function init() {
        // Load saved state first
        loadFromLocalStorage();

        // Resolve DOM hooks
        exerciseListContainer = document.getElementById('exercise-list');
        totalDurationSummary = document.getElementById('total-duration-summary');
        startTimerBtn = document.getElementById('start-timer-btn');
        cyclesValueDisplay = document.getElementById('cycles-value');
        breakValueDisplay = document.getElementById('break-value');

        pickerModal = document.getElementById('picker-modal');
        pickerModalTitle = document.getElementById('picker-modal-title');
        wheelPickerContent = document.getElementById('wheel-picker-content');

        timerOverlay = document.getElementById('timer-overlay');
        runningCycleLabel = document.getElementById('running-cycle-label');
        runningItemLabel = document.getElementById('running-item-label');
        runningTimerSeconds = document.getElementById('running-timer-seconds');
        runningOverallTime = document.getElementById('running-overall-time');
        runningNextItem = document.getElementById('running-next-item');
        nextUpCard = document.getElementById('next-up-card');
        timerPauseBtn = document.getElementById('timer-pause-btn');
        silentAudioBypass = document.getElementById('silent-audio-bypass');

        renderExerciseList();
        updateSummary();
        initDragAndDrop();
      }

      // Check DOM readiness to run initializer immediately
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      // --- Formatting Helpers ---
      function formatTime(mins, secs) {
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      function formatSeconds(totalSeconds) {
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        return formatTime(mins, secs);
      }

      // --- Exercise List Management ---
      function renderExerciseList() {
        if (!exerciseListContainer) return;
        exerciseListContainer.innerHTML = '';
        
        if (exercises.length === 0) {
          exerciseListContainer.innerHTML = `
            <div class="empty-state">
              Keine Übungen vorhanden. Tippe auf "+", um eine Übung hinzuzufügen.
            </div>
          `;
          if (startTimerBtn) startTimerBtn.disabled = true;
          return;
        }
        
        if (startTimerBtn) startTimerBtn.disabled = false;

        exercises.forEach((ex) => {
          const item = document.createElement('div');
          item.className = 'exercise-item';
          item.draggable = true;
          item.dataset.id = ex.id;
          
          item.innerHTML = `
            <div class="drag-handle" title="Reihenfolge ändern">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <div class="exercise-info">
              <input 
                type="text" 
                class="exercise-name-input" 
                value="${ex.name}" 
                placeholder="Name der Übung"
                onchange="window.renameExercise('${ex.id}', this.value)"
              />
              <div class="exercise-time-trigger" onclick="window.openExerciseTimePicker('${ex.id}')">
                ${formatTime(ex.minutes, ex.seconds)}
              </div>
            </div>
            <button class="delete-btn" onclick="window.deleteExercise('${ex.id}')" aria-label="Löschen">
              ✕
            </button>
          `;
          
          exerciseListContainer.appendChild(item);
        });
      }

      function addNewExercise() {
        const id = 'ex-' + Date.now();
        exercises.push({
          id: id,
          name: `Übung ${exercises.length + 1}`,
          minutes: 0,
          seconds: 45
        });
        saveToLocalStorage();
        renderExerciseList();
        updateSummary();
        
        // Auto focus the input of the newly added exercise
        setTimeout(() => {
          const input = exerciseListContainer.querySelector(`[data-id="${id}"] .exercise-name-input`);
          if (input) {
            input.focus();
            input.select();
          }
        }, 50);
      }

      function renameExercise(id, newName) {
        const index = exercises.findIndex(ex => ex.id === id);
        if (index !== -1) {
          exercises[index].name = newName.trim() || `Übung ${index + 1}`;
          saveToLocalStorage();
          renderExerciseList();
        }
      }

      function deleteExercise(id) {
        exercises = exercises.filter(ex => ex.id !== id);
        saveToLocalStorage();
        renderExerciseList();
        updateSummary();
      }

      // --- Drag & Drop Implementation (Mouse & Touch) ---
      let draggedElement = null;

      function initDragAndDrop() {
        try {
          // Desktop Mouse Events
          exerciseListContainer.addEventListener('dragstart', (e) => {
            const item = e.target.closest('.exercise-item');
            if (!item) return;
            draggedElement = item;
            item.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
          });

          exerciseListContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (!draggedElement) return;
            
            const container = exerciseListContainer;
            const afterElement = getDragAfterElement(container, e.clientY);
            if (afterElement == null) {
              container.appendChild(draggedElement);
            } else {
              container.insertBefore(draggedElement, afterElement);
            }
          });

          exerciseListContainer.addEventListener('dragend', (e) => {
            if (!draggedElement) return;
            draggedElement.classList.remove('dragging');
            draggedElement = null;
            saveListOrderFromDOM();
          });

          // Mobile Touch Events (Custom touch Drag & Drop emulation via Handle)
          let touchStartElement = null;
          
          exerciseListContainer.addEventListener('touchstart', (e) => {
            const handle = e.target.closest('.drag-handle');
            if (!handle) return; // Wenn nicht auf dem Handle gegriffen wird, normales Scrollen zulassen
            
            const item = handle.closest('.exercise-item');
            if (!item) return;
            
            touchStartElement = item;
            item.classList.add('dragging');
            e.preventDefault();
          }, { passive: false });

          exerciseListContainer.addEventListener('touchmove', (e) => {
            if (!touchStartElement) return;
            e.preventDefault();
            
            const touch = e.touches[0];
            const elementAtPoint = document.elementFromPoint(touch.clientX, touch.clientY);
            if (!elementAtPoint) return;
            
            const targetItem = elementAtPoint.closest('.exercise-item');
            if (targetItem && targetItem !== touchStartElement && targetItem.parentNode === exerciseListContainer) {
              const box = targetItem.getBoundingClientRect();
              const midPoint = box.top + box.height / 2;
              
              if (touch.clientY < midPoint) {
                exerciseListContainer.insertBefore(touchStartElement, targetItem);
              } else {
                exerciseListContainer.insertBefore(touchStartElement, targetItem.nextSibling);
              }
            }
          }, { passive: false });

          exerciseListContainer.addEventListener('touchend', (e) => {
            if (!touchStartElement) return;
            touchStartElement.classList.remove('dragging');
            touchStartElement = null;
            saveListOrderFromDOM();
          });
        } catch (err) {
          console.warn('Drag & Drop initialization failed:', err);
        }
      }

      function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.exercise-item:not(.dragging)')];
        
        return draggableElements.reduce((closest, child) => {
          const box = child.getBoundingClientRect();
          const offset = y - box.top - box.height / 2;
          if (offset < 0 && offset > closest.offset) {
            return { offset: offset, element: child };
          } else {
            return closest;
          }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
      }

      function saveListOrderFromDOM() {
        const items = [...exerciseListContainer.querySelectorAll('.exercise-item')];
        const reordered = items.map(item => {
          const id = item.dataset.id;
          return exercises.find(ex => ex.id === id);
        }).filter(Boolean);
        
        exercises = reordered;
        saveToLocalStorage();
        updateSummary();
      }

      // --- Total Duration Calculation ---
      function calculateTotalDuration() {
        if (exercises.length === 0) return 0;
        
        let exerciseSeconds = 0;
        exercises.forEach(ex => {
          exerciseSeconds += (ex.minutes * 60) + ex.seconds;
        });
        
        const totalExerciseSteps = exercises.length * cycles;
        const totalBreakSteps = Math.max(0, totalExerciseSteps - 1);
        const breakSeconds = (globalBreak.minutes * 60) + globalBreak.seconds;
        
        return (exerciseSeconds * cycles) + (totalBreakSteps * breakSeconds);
      }

      function updateSummary() {
        const totalSeconds = calculateTotalDuration();
        if (totalDurationSummary) totalDurationSummary.innerText = formatSeconds(totalSeconds);
        if (cyclesValueDisplay) cyclesValueDisplay.innerText = cycles;
        if (breakValueDisplay) breakValueDisplay.innerText = formatTime(globalBreak.minutes, globalBreak.seconds);
      }

      // --- Custom Apple Watch-Style Wheel Picker Engine ---
      function createWheelColumn(id, label, min, max, initialValue, step = 1) {
        const column = document.createElement('div');
        column.className = 'wheel-column';
        column.id = id;
        
        const scrollTrack = document.createElement('div');
        scrollTrack.className = 'wheel-scroll-track';
        
        for (let i = min; i <= max; i += step) {
          const item = document.createElement('div');
          item.className = 'wheel-item';
          item.dataset.value = i;
          item.innerText = String(i).padStart(2, '0');
          scrollTrack.appendChild(item);
        }
        
        column.appendChild(scrollTrack);
        column.addEventListener('scroll', () => {
          updateSelectedClass(column);
        });
        
        return column;
      }

      function updateSelectedClass(column) {
        const items = column.querySelectorAll('.wheel-item');
        const columnRect = column.getBoundingClientRect();
        const centerY = columnRect.top + columnRect.height / 2;
        
        let closestItem = null;
        let minDistance = Infinity;
        
        items.forEach(item => {
          const rect = item.getBoundingClientRect();
          const itemCenterY = rect.top + rect.height / 2;
          const distance = Math.abs(centerY - itemCenterY);
          
          if (distance < minDistance) {
            minDistance = distance;
            closestItem = item;
          }
        });
        
        items.forEach(item => {
          if (item === closestItem) {
            item.classList.add('selected');
          } else {
            item.classList.remove('selected');
          }
        });
      }

      function selectWheelValue(column, value) {
        const items = column.querySelectorAll('.wheel-item');
        let selectedIndex = 0;
        items.forEach((item, idx) => {
          if (parseInt(item.dataset.value) === value) {
            selectedIndex = idx;
          }
        });
        
        setTimeout(() => {
          column.scrollTop = selectedIndex * 40;
          updateSelectedClass(column);
        }, 40);
      }

      function getSelectedWheelValue(columnId) {
        const column = document.getElementById(columnId);
        if (!column) return 0;
        
        const items = column.querySelectorAll('.wheel-item');
        const columnRect = column.getBoundingClientRect();
        const centerY = columnRect.top + columnRect.height / 2;
        
        let closestItem = null;
        let minDistance = Infinity;
        
        items.forEach(item => {
          const rect = item.getBoundingClientRect();
          const itemCenterY = rect.top + rect.height / 2;
          const distance = Math.abs(centerY - itemCenterY);
          if (distance < minDistance) {
            minDistance = distance;
            closestItem = item;
          }
        });
        
        if (closestItem) {
          return parseInt(closestItem.dataset.value);
        }
        return 0;
      }

      // Open Picker Modals
      function openCyclesPicker() {
        activePicker.type = 'cycles';
        activePicker.targetId = null;
        
        pickerModalTitle.innerText = 'Runden (Zyklen) wählen';
        wheelPickerContent.innerHTML = '';
        
        const indicator = document.createElement('div');
        indicator.className = 'wheel-selection-indicator';
        wheelPickerContent.appendChild(indicator);
        
        const cyclesCol = createWheelColumn('cycles-column', 'Runden', 1, 99, cycles);
        wheelPickerContent.appendChild(cyclesCol);
        
        const fadeOverlay = document.createElement('div');
        fadeOverlay.className = 'wheel-fade-overlay';
        wheelPickerContent.appendChild(fadeOverlay);
        
        pickerModal.classList.add('active');
        selectWheelValue(cyclesCol, cycles);
      }

      function openBreakPicker() {
        activePicker.type = 'break';
        activePicker.targetId = null;
        
        pickerModalTitle.innerText = 'Pausenzeit wählen';
        wheelPickerContent.innerHTML = '';
        
        const indicator = document.createElement('div');
        indicator.className = 'wheel-selection-indicator';
        wheelPickerContent.appendChild(indicator);
        
        const minCol = createWheelColumn('min-column', 'Min', 0, 59, globalBreak.minutes);
        const divider = document.createElement('div');
        divider.className = 'picker-divider';
        divider.innerText = ':';
        const secCol = createWheelColumn('sec-column', 'Sec', 0, 59, globalBreak.seconds);
        
        wheelPickerContent.appendChild(minCol);
        wheelPickerContent.appendChild(divider);
        wheelPickerContent.appendChild(secCol);
        
        const fadeOverlay = document.createElement('div');
        fadeOverlay.className = 'wheel-fade-overlay';
        wheelPickerContent.appendChild(fadeOverlay);
        
        pickerModal.classList.add('active');
        selectWheelValue(minCol, globalBreak.minutes);
        selectWheelValue(secCol, globalBreak.seconds);
      }

      function openExerciseTimePicker(id) {
        const ex = exercises.find(item => item.id === id);
        if (!ex) return;
        
        activePicker.type = 'exercise';
        activePicker.targetId = id;
        
        pickerModalTitle.innerText = `${ex.name} - Zeit`;
        wheelPickerContent.innerHTML = '';
        
        const indicator = document.createElement('div');
        indicator.className = 'wheel-selection-indicator';
        wheelPickerContent.appendChild(indicator);
        
        const minCol = createWheelColumn('min-column', 'Min', 0, 59, ex.minutes);
        const divider = document.createElement('div');
        divider.className = 'picker-divider';
        divider.innerText = ':';
        const secCol = createWheelColumn('sec-column', 'Sec', 0, 59, ex.seconds);
        
        wheelPickerContent.appendChild(minCol);
        wheelPickerContent.appendChild(divider);
        wheelPickerContent.appendChild(secCol);
        
        const fadeOverlay = document.createElement('div');
        fadeOverlay.className = 'wheel-fade-overlay';
        wheelPickerContent.appendChild(fadeOverlay);
        
        pickerModal.classList.add('active');
        selectWheelValue(minCol, ex.minutes);
        selectWheelValue(secCol, ex.seconds);
      }

      function closePickerModal() {
        if (activePicker.type === 'cycles') {
          cycles = getSelectedWheelValue('cycles-column') || 1;
        } else if (activePicker.type === 'break') {
          globalBreak.minutes = getSelectedWheelValue('min-column');
          globalBreak.seconds = getSelectedWheelValue('sec-column');
          if (globalBreak.minutes === 0 && globalBreak.seconds === 0) {
            globalBreak.seconds = 5; // safety fallback
          }
        } else if (activePicker.type === 'exercise' && activePicker.targetId) {
          const ex = exercises.find(item => item.id === activePicker.targetId);
          if (ex) {
            ex.minutes = getSelectedWheelValue('min-column');
            ex.seconds = getSelectedWheelValue('sec-column');
            if (ex.minutes === 0 && ex.seconds === 0) {
              ex.seconds = 10; // safety fallback
            }
          }
        }
        
        saveToLocalStorage();
        pickerModal.classList.remove('active');
        activePicker.type = null;
        activePicker.targetId = null;
        
        renderExerciseList();
        updateSummary();
      }

      // --- Web Audio API Synth Sound mit Stummmodus-Bypass ---
      function playBeep(frequency, duration) {
        try {
          // Trigger den stummen HTML5-Audio-Bypass für mobile Browser
          if (silentAudioBypass) {
            silentAudioBypass.play().catch(() => {});
          }

          if (!timer.audioContext) {
            timer.audioContext = new (window.AudioContext || window.webkitAudioContext)();
          }
          
          const ctx = timer.audioContext;
          if (ctx.state === 'suspended') {
            ctx.resume();
          }
          
          const osc = ctx.createOscillator();
          const gainNode = ctx.createGain();
          
          osc.connect(gainNode);
          gainNode.connect(ctx.destination);
          
          osc.type = 'sine';
          osc.frequency.setValueAtTime(frequency, ctx.currentTime);
          
          gainNode.gain.setValueAtTime(0.8, ctx.currentTime); // Erhöhte Lautstärke
          gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
          
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + duration);
        } catch (err) {
          console.warn('Sound synthesis beep failed:', err);
        }
      }

      // --- Timer Engine ---
      function startWorkout() {
        if (exercises.length === 0) return;
        
        try {
          if (!timer.audioContext) {
            timer.audioContext = new (window.AudioContext || window.webkitAudioContext)();
          }
        } catch(e) {}
        
        timer.playlist = [];
        const breakSeconds = (globalBreak.minutes * 60) + globalBreak.seconds;
        
        for (let c = 1; c <= cycles; c++) {
          exercises.forEach((ex, idx) => {
            const exerciseSeconds = (ex.minutes * 60) + ex.seconds;
            
            timer.playlist.push({
              type: 'exercise',
              name: ex.name,
              duration: exerciseSeconds,
              cycle: c
            });
            
            const isLastExerciseInWorkout = (c === cycles && idx === exercises.length - 1);
            if (!isLastExerciseInWorkout) {
              timer.playlist.push({
                type: 'break',
                name: 'Pause',
                duration: breakSeconds,
                cycle: c
              });
            }
          });
        }
        
        timer.currentStepIndex = 0;
        timer.stepSecondsRemaining = timer.playlist[0].duration;
        
        let overallSum = 0;
        timer.playlist.forEach(step => overallSum += step.duration);
        timer.overallSecondsRemaining = overallSum;
        
        timer.state = 'running';
        if (timerPauseBtn) timerPauseBtn.innerText = 'Pause';
        if (timerOverlay) timerOverlay.classList.add('active');
        const setupScreen = document.getElementById('app-setup-screen');
        if (setupScreen) setupScreen.style.display = 'none';
        
        updateTimerUI();
        
        clearInterval(timer.intervalId);
        timer.intervalId = setInterval(tick, 1000);
      }

      function tick() {
        if (timer.state !== 'running') return;
        
        timer.stepSecondsRemaining--;
        timer.overallSecondsRemaining--;
        
        const currentStep = timer.playlist[timer.currentStepIndex];
        
        // 3 short warning beeps and short flashes at 3, 2, 1 seconds
        if (timer.stepSecondsRemaining >= 1 && timer.stepSecondsRemaining <= 3) {
          playBeep(800, 0.1);
          triggerScreenFlash('short', currentStep.type);
        }
        
        // 4th longer beep + long flash at transition (0 seconds)
        if (timer.stepSecondsRemaining <= 0) {
          triggerScreenFlash('long', currentStep.type);
          playBeep(800, 1.2);
          
          timer.currentStepIndex++;
          
          if (timer.currentStepIndex >= timer.playlist.length) {
            clearInterval(timer.intervalId);
            timer.state = 'setup';
            
            setTimeout(() => playBeep(600, 0.15), 100);
            setTimeout(() => playBeep(800, 0.15), 250);
            setTimeout(() => playBeep(1200, 0.80), 400);
            
            setTimeout(() => {
              if (timerOverlay) timerOverlay.classList.remove('active');
              const setupScreen = document.getElementById('app-setup-screen');
              if (setupScreen) setupScreen.style.display = 'flex';
            }, 1000);
            
            if (runningTimerSeconds) runningTimerSeconds.innerText = "00:00";
            if (runningOverallTime) runningOverallTime.innerText = "00:00";
            return;
          }
          
          const nextStep = timer.playlist[timer.currentStepIndex];
          timer.stepSecondsRemaining = nextStep.duration;
        }
        
        updateTimerUI();
      }

      function triggerScreenFlash(intensity, type) {
        if (!timerOverlay) return;
        timerOverlay.classList.remove(
          'flash-short-exercise', 
          'flash-short-break', 
          'flash-long-exercise', 
          'flash-long-break'
        );
        void timerOverlay.offsetWidth;
        
        const className = `flash-${intensity}-${type}`;
        timerOverlay.classList.add(className);
      }

      function updateTimerUI() {
        if (!timerOverlay) return;
        const currentStep = timer.playlist[timer.currentStepIndex];
        
        if (currentStep.type === 'exercise') {
          timerOverlay.classList.remove('state-break');
          timerOverlay.classList.add('state-exercise');
        } else {
          timerOverlay.classList.remove('state-exercise');
          timerOverlay.classList.add('state-break');
        }
        
        if (runningCycleLabel) runningCycleLabel.innerText = `Runde ${currentStep.cycle} / ${cycles}`;
        if (runningItemLabel) runningItemLabel.innerText = currentStep.name;
        if (runningTimerSeconds) runningTimerSeconds.innerText = formatSeconds(timer.stepSecondsRemaining);
        if (runningOverallTime) runningOverallTime.innerText = formatSeconds(timer.overallSecondsRemaining);
        
        let nextExercise = null;
        for (let i = timer.currentStepIndex + 1; i < timer.playlist.length; i++) {
          if (timer.playlist[i].type === 'exercise') {
            nextExercise = timer.playlist[i];
            break;
          }
        }
        
        if (nextExercise) {
          if (nextUpCard) nextUpCard.style.display = 'block';
          if (runningNextItem) {
            runningNextItem.innerText = `${nextExercise.name} (${formatSeconds(nextExercise.duration)})`;
          }
        } else {
          if (nextUpCard) nextUpCard.style.display = 'none';
        }
      }

      function togglePauseWorkout() {
        if (timer.state === 'running') {
          timer.state = 'paused';
          if (timerPauseBtn) timerPauseBtn.innerText = 'Fortsetzen';
        } else if (timer.state === 'paused') {
          timer.state = 'running';
          if (timerPauseBtn) timerPauseBtn.innerText = 'Pause';
        }
      }

      function stopWorkout() {
        clearInterval(timer.intervalId);
        timer.state = 'setup';
        if (timerOverlay) {
          timerOverlay.classList.remove('active');
          timerOverlay.classList.remove(
            'flash-short-exercise', 
            'flash-short-break', 
            'flash-long-exercise', 
            'flash-long-break'
          );
        }
        const setupScreen = document.getElementById('app-setup-screen');
        if (setupScreen) setupScreen.style.display = 'flex';
      }

      function skipCurrentStep() {
        if (timer.state === 'setup') return;
        
        playBeep(1200, 0.2);
        
        const currentStep = timer.playlist[timer.currentStepIndex];
        triggerScreenFlash('long', currentStep.type);
        
        timer.currentStepIndex++;
        
        if (timer.currentStepIndex >= timer.playlist.length) {
          clearInterval(timer.intervalId);
          timer.state = 'setup';
          
          setTimeout(() => playBeep(600, 0.15), 100);
          setTimeout(() => playBeep(800, 0.15), 250);
          setTimeout(() => playBeep(1200, 0.40), 400);
          
          setTimeout(() => {
            if (timerOverlay) timerOverlay.classList.remove('active');
          }, 1000);
          return;
        }
        
        const nextStep = timer.playlist[timer.currentStepIndex];
        timer.overallSecondsRemaining -= timer.stepSecondsRemaining;
        if (timer.overallSecondsRemaining < 0) timer.overallSecondsRemaining = 0;
        
        timer.stepSecondsRemaining = nextStep.duration;
        updateTimerUI();
      }

      // --- Expose Global Functions for DOM Event Bindings ---
      window.addNewExercise = addNewExercise;
      window.renameExercise = renameExercise;
      window.deleteExercise = deleteExercise;
      window.openCyclesPicker = openCyclesPicker;
      window.openBreakPicker = openBreakPicker;
      window.openExerciseTimePicker = openExerciseTimePicker;
      window.closePickerModal = closePickerModal;
      window.startWorkout = startWorkout;
      window.togglePauseWorkout = togglePauseWorkout;
      window.stopWorkout = stopWorkout;
      window.skipCurrentStep = skipCurrentStep;

    })();
  </script>
</body>
